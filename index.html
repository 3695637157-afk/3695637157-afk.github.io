<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102821">
  <title>大学物理竞赛 · 真题贯通讲义</title>
  <style>
    html,body{margin:0;min-height:100%;background:#102821;color:#f5f6f0}
    body{display:grid;place-items:center;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    main{width:min(560px,calc(100% - 48px));padding:36px;background:#f5f6f0;color:#18211d}
    h1{margin:0;font-size:clamp(2rem,8vw,4rem);line-height:1.02}
    p{margin:20px 0 0;color:#5b675f;line-height:1.7}
    a{color:#c8372f}
    .mirror-frame{display:block;width:100vw;height:100dvh;border:0}
  </style>
</head>
<body>
  <main id="boot">
    <h1>大学物理竞赛<br>真题贯通讲义</h1>
    <p id="status">正在载入校订版讲义，请稍候。</p>
  </main>
  <noscript><main><p>需要启用 JavaScript 才能载入完整讲义。</p></main></noscript>
  <script>
    (async () => {
      try {
        if (!("DecompressionStream" in window)) {
          throw new Error("当前浏览器不支持页面解压，请更新浏览器。");
        }
        const paths = [
          "https://cdn.jsdelivr.net/gh/3695637157-afk/3695637157-afk.github.io@main/payload-01.txt?v=20261021",
          "https://cdn.jsdelivr.net/gh/3695637157-afk/3695637157-afk.github.io@main/payload-02.txt?v=20261021",
          "https://cdn.jsdelivr.net/gh/3695637157-afk/3695637157-afk.github.io@main/payload-03.txt?v=20261021"
        ];
        const parts = await Promise.all(paths.map(async (path) => {
          const response = await fetch(path, { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.text();
        }));
        const encoded = parts.join("");
        const binary = atob(encoded.replace(/\s+/g, ""));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        const stream = new Blob([bytes])
          .stream()
          .pipeThrough(new DecompressionStream("gzip"));
        const html = await new Response(stream).text();
        if (["raw.githack.com", "rawcdn.githack.com"].includes(location.hostname)) {
          document.documentElement.style.overflow = "hidden";
          document.body.style.display = "block";
          document.body.style.overflow = "hidden";
          document.body.innerHTML = "";
          const frame = document.createElement("iframe");
          frame.className = "mirror-frame";
          frame.title = "大学物理竞赛真题贯通讲义";
          frame.srcdoc = html;
          document.body.append(frame);
          return;
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector("#status").innerHTML =
          "讲义载入失败。请刷新页面；仍失败时可" +
          ' <a href="https://3695637157-afk.github.io/">重试</a>。';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
